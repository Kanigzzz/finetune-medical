  model:
    name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

  lora:
    r: 8
    alpha: 16
    dropout: 0.05

  training:
    num_train_epochs: 3
    per_device_train_batch_size: 4
    learning_rate: 2.0e-4
    warmup_steps: 100
    weight_decay: 0.01

  data:
    dataset_name: "qiaojin/PubMedQA"
    max_length: 512
    test_size: 0.1
    seed: 42
